services:
  backend:
    build: ./backend
    volumes:
      - sqlite_data:/data
      # GLD100 mosaic tiles mounted from host instead of copied into the image
      - ./backend/moon-map:/backend/moon-map:ro
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  sqlite_data:
